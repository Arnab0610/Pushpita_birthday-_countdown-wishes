<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>The Countdown to 24 🌻</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Fraunces:wght@700;900&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet" />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%; height: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: 'Cormorant Garamond', Georgia, serif;
      background: radial-gradient(circle at center, #fff9f0 0%, #fde7cb 60%, #f7cda4 100%);
      color: #4a261b;
      user-select: none;
    }

    #rainCanvas {
      position: fixed; inset: 0; width: 100%; height: 100%;
      z-index: 1; pointer-events: none;
    }

    /* Screen Wrap */
    .app-viewport {
      position: relative; z-index: 2;
      width: 100%; height: 100dvh;
      display: flex; flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: clamp(10px, 2.5vh, 25px) 15px 12px;
      text-align: center;
    }

    .title {
      font-size: clamp(17px, 3.5vw, 32px);
      font-style: italic; font-weight: 600;
      color: #a8421e;
      text-shadow: 0 1px 4px rgba(255,255,255,0.8);
      line-height: 1.2;
      flex-shrink: 0;
    }

    /* 1. Pushpita & Sunflowers Trio Stage */
    .stage-center {
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: clamp(10px, 3vw, 45px);
      width: 100%;
      max-width: 680px;
      margin: auto 0;
      flex-shrink: 1;
    }

    .flower-side {
      display: flex; flex-direction: column; align-items: center;
      flex: 1;
      max-width: clamp(70px, 15vw, 130px);
    }
    .flower-svg { width: 100%; height: auto; }

    /* Pushpita Box */
    .pushpita-box {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1.5;
      max-width: clamp(130px, 24vw, 200px);
    }

    .pushpita-img {
      width: 100%; height: auto;
      filter: drop-shadow(0 10px 22px rgba(180, 80, 20, 0.28));
      animation: charFloat 3.5s ease-in-out infinite alternate;
      transform-origin: center bottom;
    }

    .pushpita-glow {
      position: absolute;
      bottom: 0; width: 85%; aspect-ratio: 1/1;
      background: radial-gradient(circle, rgba(255, 179, 0, 0.45) 0%, rgba(255, 112, 67, 0) 70%);
      border-radius: 50%; z-index: -1; filter: blur(14px);
    }

    /* Speeech Bubbles (23 & 24) */
    .flower-bubble {
      background: rgba(255, 255, 255, 0.95);
      padding: clamp(3px, 0.8vh, 6px) clamp(6px, 1.5vw, 12px);
      border-radius: 12px;
      font-size: clamp(9px, 1.8vw, 13px);
      font-weight: 700;
      margin-bottom: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
      white-space: nowrap;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .bubble-sad {
      color: #6d4c41;
      border: 1px solid #bcaaa4;
    }
    .bubble-happy {
      color: #b73812;
      border: 1px solid #ffcc80;
    }

    /* Pushpita Interactive Bubble */
    .char-bubble {
      position: relative;
      background: #ffffff;
      border: 1.5px solid #ffb300;
      color: #bf360c;
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: clamp(4px, 1vh, 8px) clamp(8px, 1.8vw, 15px);
      border-radius: 14px;
      font-size: clamp(10px, 1.9vw, 13px);
      font-weight: 700;
      margin-bottom: 8px;
      box-shadow: 0 4px 12px rgba(230, 81, 0, 0.16);
      min-height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      max-width: clamp(130px, 25vw, 200px);
      line-height: 1.25;
      transition: all 0.25s ease;
      opacity: 0;
      transform: scale(0.9);
    }
    .char-bubble.active { opacity: 1; transform: scale(1); }

    .char-bubble::after {
      content: ''; position: absolute;
      bottom: -6px; left: 50%; transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 6px solid transparent; border-right: 6px solid transparent;
      border-top: 6px solid #ffffff;
    }

    /* 2. Countdown Grid (Center) */
    .countdown-grid {
      display: flex;
      justify-content: center;
      gap: clamp(8px, 2vw, 20px);
      width: 100%;
      max-width: 480px;
      margin: 10px auto;
      flex-shrink: 0;
    }

    .time-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.95);
      padding: clamp(8px, 1.8vh, 16px) clamp(8px, 2vw, 16px);
      border-radius: clamp(12px, 1.8vw, 16px);
      box-shadow: 0 8px 22px -4px rgba(150, 60, 20, 0.15);
      flex: 1;
      max-width: 95px;
      min-width: 0;
    }
    .time-num {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 900;
      font-size: clamp(20px, 4.2vw, 36px);
      color: #bf360c;
      line-height: 1;
    }
    .time-label {
      font-size: clamp(9px, 1.6vw, 12px);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #795548;
      margin-top: 4px;
      font-weight: 600;
    }

    /* 3. Bottom Zone & Arnab */
    .bottom-zone {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      flex-shrink: 0;
    }

    .footer-note {
      font-size: clamp(11px, 2vw, 15px);
      font-style: italic;
      color: #6d4c41;
      margin-top: 4px;
    }

    /* Arnab Floating Mascot (Responsive Corner Placement) */
    .arnab-anchor {
      position: fixed;
      bottom: clamp(6px, 1.5vh, 15px);
      left: clamp(10px, 4vw, 50px);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      width: clamp(85px, 14vw, 150px);
      pointer-events: none;
    }

    .arnab-img {
      width: 100%; height: auto;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.22));
      animation: arnabFloat 3.8s ease-in-out infinite alternate;
    }

    .arnab-bubble {
      position: relative;
      background: #ffffff;
      border: 1.5px solid #0288d1;
      color: #01579b;
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: clamp(5px, 1vh, 8px) clamp(8px, 1.6vw, 14px);
      border-radius: 14px;
      font-size: clamp(10px, 1.8vw, 13px);
      font-weight: 700;
      margin-bottom: 6px;
      margin-left: 6px;
      box-shadow: 0 4px 12px rgba(2, 136, 209, 0.18);
      min-height: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: left;
      max-width: clamp(130px, 24vw, 200px);
      line-height: 1.25;
      transition: all 0.25s ease;
      opacity: 0;
      transform: scale(0.9);
    }
    .arnab-bubble.active { opacity: 1; transform: scale(1); }

    .arnab-bubble::after {
      content: ''; position: absolute;
      bottom: -6px; left: 16px;
      width: 0; height: 0;
      border-left: 6px solid transparent; border-right: 6px solid transparent;
      border-top: 6px solid #ffffff;
    }

    /* Animations */
    .char-talking { animation: talkBounce 0.35s ease-in-out infinite alternate !important; }
    @keyframes talkBounce { 0% { transform: scale(1); } 100% { transform: scale(1.05) translateY(-2px); } }
    @keyframes charFloat { 0% { transform: translateY(0); } 100% { transform: translateY(-6px); } }
    @keyframes arnabFloat { 0% { transform: translateY(0); } 100% { transform: translateY(-5px); } }

    .flower-23 { animation: sadFloat 3s ease-in-out infinite alternate; }
    @keyframes sadFloat { 0% { transform: translateY(0) rotate(-2deg); } 100% { transform: translateY(4px) rotate(-4deg); } }
    .flower-24 { animation: happyBounce 2.5s ease-in-out infinite alternate; }
    @keyframes happyBounce { 0% { transform: translateY(0) rotate(2deg); } 100% { transform: translateY(-6px) rotate(-2deg); } }
    .waving-arm-24 { transform-origin: 36px 12px; animation: waveBye 1s ease-in-out infinite alternate; }
    @keyframes waveBye { 0% { transform: rotate(-10deg); } 100% { transform: rotate(30deg); } }

    @media (max-width: 480px) {
      .flower-bubble { display: none; } /* Ultra-small screen safety */
      .arnab-bubble { max-width: 130px; font-size: 10px; }
      .char-bubble { max-width: 125px; font-size: 10px; }
    }
  </style>
</head>
<body>

  <canvas id="rainCanvas"></canvas>

  <div class="app-viewport">
    <h1 class="title">🌻 Counting Down to Pushpita's Special Day 🌻</h1>

    <!-- 1. Pushpita, 23 & 24 Flowers Stage -->
    <div class="stage-center">
      <!-- 23 Sunflower -->
      <div class="flower-side flower-23">
        <div class="flower-bubble bubble-sad">যেতে চাই না... 🥺</div>
        <svg class="flower-svg" viewBox="0 0 180 180">
          <g transform="translate(90,90)">
            <g fill="#ffa000" opacity="0.85">
              <path d="M0,-65 Q12,-35 0,-15 Q-12,-35 0,-65" transform="rotate(0)" />
              <path d="M0,-65 Q12,-35 0,-15 Q-12,-35 0,-65" transform="rotate(45)" />
              <path d="M0,-65 Q12,-35 0,-15 Q-12,-35 0,-65" transform="rotate(90)" />
              <path d="M0,-65 Q12,-35 0,-15 Q-12,-35 0,-65" transform="rotate(135)" />
              <path d="M0,-65 Q12,-35 0,-15 Q-12,-35 0,-65" transform="rotate(180)" />
              <path d="M0,-65 Q12,-35 0,-15 Q-12,-35 0,-65" transform="rotate(225)" />
              <path d="M0,-65 Q12,-35 0,-15 Q-12,-35 0,-65" transform="rotate(270)" />
              <path d="M0,-65 Q12,-35 0,-15 Q-12,-35 0,-65" transform="rotate(315)" />
            </g>
            <g fill="#ffca28">
              <path d="M0,-58 Q10,-30 0,-12 Q-10,-30 0,-58" transform="rotate(22)" />
              <path d="M0,-58 Q10,-30 0,-12 Q-10,-30 0,-58" transform="rotate(67)" />
              <path d="M0,-58 Q10,-30 0,-12 Q-10,-30 0,-58" transform="rotate(112)" />
              <path d="M0,-58 Q10,-30 0,-12 Q-10,-30 0,-58" transform="rotate(157)" />
              <path d="M0,-58 Q10,-30 0,-12 Q-10,-30 0,-58" transform="rotate(202)" />
              <path d="M0,-58 Q10,-30 0,-12 Q-10,-30 0,-58" transform="rotate(247)" />
              <path d="M0,-58 Q10,-30 0,-12 Q-10,-30 0,-58" transform="rotate(292)" />
              <path d="M0,-58 Q10,-30 0,-12 Q-10,-30 0,-58" transform="rotate(337)" />
            </g>
            <circle r="36" fill="#4e2619" stroke="#ffb300" stroke-width="2" />
            <ellipse cx="-13" cy="-14" rx="3.5" ry="5" fill="#ffffff" />
            <circle cx="-13" cy="-13" r="2.2" fill="#212121" />
            <ellipse cx="13" cy="-14" rx="3.5" ry="5" fill="#ffffff" />
            <circle cx="13" cy="-13" r="2.2" fill="#212121" />
            <path d="M-19,-21 Q-13,-24 -7,-20" fill="none" stroke="#ffe082" stroke-width="1.6" stroke-linecap="round" />
            <path d="M7,-20 Q13,-24 19,-21" fill="none" stroke="#ffe082" stroke-width="1.6" stroke-linecap="round" />
            <path d="M-7,-4 Q0,-9 7,-4" fill="none" stroke="#ffe082" stroke-width="2" stroke-linecap="round" />
            <text y="24" text-anchor="middle" font-family="'Fraunces', serif" font-weight="900" font-size="25" fill="#ffd54f">23</text>
          </g>
        </svg>
      </div>

      <!-- Pushpita Center -->
      <div class="pushpita-box">
        <div class="char-bubble" id="pushpitaBubble">...</div>
        <div class="pushpita-glow"></div>
        <img src="media/pushpita-character.png" alt="Pushpita" class="pushpita-img" id="pushpitaImg" />
      </div>

      <!-- 24 Sunflower -->
      <div class="flower-side flower-24">
        <div class="flower-bubble bubble-happy">বিদায় ২৩! 👋✨</div>
        <svg class="flower-svg" viewBox="0 0 180 180">
          <g transform="translate(90,90)">
            <g class="waving-arm-24">
              <path d="M36,12 C55,10 72,-5 68,-32" fill="none" stroke="#388e3c" stroke-width="7" stroke-linecap="round" />
              <ellipse cx="68" cy="-35" rx="9" ry="14" fill="#4caf50" transform="rotate(20 68 -35)" />
            </g>
            <g fill="#ffb300">
              <path d="M0,-68 Q14,-35 0,-15 Q-14,-35 0,-68" transform="rotate(0)" />
              <path d="M0,-68 Q14,-35 0,-15 Q-14,-35 0,-68" transform="rotate(45)" />
              <path d="M0,-68 Q14,-35 0,-15 Q-14,-35 0,-68" transform="rotate(90)" />
              <path d="M0,-68 Q14,-35 0,-15 Q-14,-35 0,-68" transform="rotate(135)" />
              <path d="M0,-68 Q14,-35 0,-15 Q-14,-35 0,-68" transform="rotate(180)" />
              <path d="M0,-68 Q14,-35 0,-15 Q-14,-35 0,-68" transform="rotate(225)" />
              <path d="M0,-68 Q14,-35 0,-15 Q-14,-35 0,-68" transform="rotate(270)" />
              <path d="M0,-68 Q14,-35 0,-15 Q-14,-35 0,-68" transform="rotate(315)" />
            </g>
            <circle r="36" fill="#3e1f14" stroke="#fff9c4" stroke-width="2.5" />
            <path d="M-17,-13 Q-12,-19 -7,-13" fill="none" stroke="#fff59d" stroke-width="2.6" stroke-linecap="round" />
            <path d="M7,-13 Q12,-19 17,-13" fill="none" stroke="#fff59d" stroke-width="2.6" stroke-linecap="round" />
            <path d="M-9,-6 Q0,3 9,-6" fill="none" stroke="#fff59d" stroke-width="2.6" stroke-linecap="round" />
            <circle cx="-14" cy="-5" r="3" fill="#ff7043" opacity="0.75" />
            <circle cx="14" cy="-5" r="3" fill="#ff7043" opacity="0.75" />
            <text y="24" text-anchor="middle" font-family="'Fraunces', serif" font-weight="900" font-size="25" fill="#fff59d">24</text>
          </g>
        </svg>
      </div>
    </div>

    <!-- 2. Countdown Grid (Dujon-er Thik Majhe) -->
    <div class="countdown-grid">
      <div class="time-card"><div class="time-num" id="d">00</div><div class="time-label">Days</div></div>
      <div class="time-card"><div class="time-num" id="h">00</div><div class="time-label">Hours</div></div>
      <div class="time-card"><div class="time-num" id="m">00</div><div class="time-label">Mins</div></div>
      <div class="time-card"><div class="time-num" id="s">00</div><div class="time-label">Secs</div></div>
    </div>

    <!-- 3. Bottom Zone & Footer Note -->
    <div class="bottom-zone">
      <p class="footer-note">✦ The grand celebration begins on 14th October, 12:00 AM 🎂 ✦</p>
    </div>
  </div>

  <!-- 4. Arnab Mascot (Bottom Left Corner) -->
  <div class="arnab-anchor">
    <div class="arnab-bubble" id="arnabBubble">...</div>
    <img src="media/arnab-character.png" alt="Arnab" class="arnab-img" id="arnabImg" />
  </div>

  <script type="module" src="./main.js"></script>

  <!-- Interactive Dual Conversation Engine -->
  <script>
    const conversation = [
      {
        arnab: "তোর স্পেশাল দিন কিন্তু এসে গেল! 🌻",
        pushpita: "হুম! ২৪ শুরু হতে আর বেশি বাকি নেই! 🙈"
      },
      {
        arnab: "১৪ তারিখের জন্য কিন্তু এক্সাইটেড? 👀",
        pushpita: "হ্যাঁ রে! কী সারপ্রাইজ রেডি করছিস বল তো? 🎈"
      },
      {
        arnab: "আগে থেকে বললে সারপ্রাইজ কিসের! ⏳",
        pushpita: "আচ্ছা বেশ! কাউন্টডাউনেই নজর রাখছি! 💛"
      }
    ];

    let convIdx = 0;
    const aBubble = document.getElementById('arnabBubble');
    const pBubble = document.getElementById('pushpitaBubble');
    const aImg = document.getElementById('arnabImg');
    const pImg = document.getElementById('pushpitaImg');

    function typeWriter(element, imgElement, text, speed, callback) {
      element.textContent = "";
      element.classList.add('active');
      if (imgElement) imgElement.classList.add('char-talking');

      let i = 0;
      const timer = setInterval(() => {
        if (i < text.length) {
          element.textContent += text.charAt(i);
          i++;
        } else {
          clearInterval(timer);
          if (imgElement) imgElement.classList.remove('char-talking');
          if (callback) callback();
        }
      }, speed);
    }

    function runConversationStep() {
      const step = conversation[convIdx];

      typeWriter(aBubble, aImg, step.arnab, 38, () => {
        setTimeout(() => {
          typeWriter(pBubble, pImg, step.pushpita, 38, () => {
            setTimeout(() => {
              aBubble.classList.remove('active');
              pBubble.classList.remove('active');

              setTimeout(() => {
                convIdx = (convIdx + 1) % conversation.length;
                runConversationStep();
              }, 400);
            }, 3000);
          });
        }, 800);
      });
    }

    setTimeout(runConversationStep, 1000);
  </script>
</body>
</html>
